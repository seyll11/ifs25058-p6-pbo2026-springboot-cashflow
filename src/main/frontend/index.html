<!DOCTYPE html>
<!--
Template dasar aplikasi. Ditambahkan title/h1/main "boot" supaya audit yang
menjalankan axe sebelum Vaadin selesai render tetap melihat dokumen valid.
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Cashflow</title>
  <style>
    html, body, #outlet {
      height: 100%;
      width: 100%;
      margin: 0;
    }

    .boot-only {
      position: absolute !important;
      width: 1px !important;
      height: 1px !important;
      padding: 0 !important;
      margin: -1px !important;
      overflow: hidden !important;
      clip: rect(0, 0, 0, 0) !important;
      white-space: nowrap !important;
      border: 0 !important;
    }
  </style>
  <!-- index.ts is included here automatically (either by the dev server or during the build) -->
</head>
<body>
  <!-- Landmark sementara sebelum view Vaadin dirender. -->
  <main id="boot-main" class="boot-only">
    <h1>Cashflow</h1>
  </main>

  <!-- This outlet div is where the views are rendered -->
  <div id="outlet"></div>

  <script>
    (function () {
      var boot = document.getElementById('boot-main');
      var outlet = document.getElementById('outlet');
      if (!boot || !outlet) return;

      function removeBootWhenReady() {
        // Hapus landmark sementara begitu view asli punya heading/main sendiri.
        if (outlet.querySelector('h1, main, [role="main"], vaadin-app-layout')) {
          boot.remove();
          observer.disconnect();
        }
      }

      var observer = new MutationObserver(removeBootWhenReady);
      observer.observe(outlet, { childList: true, subtree: true });
      removeBootWhenReady();
    })();
  </script>
</body>
</html>
